[project]
name = "nemotron-parakeet-diarization-demo"
version = "0.1.0"
description = "Speaker-attributed ASR demo combining nvidia/Nemotron-3-Diarization and nvidia/parakeet-tdt-0.6b-v3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nemo_toolkit[asr] @ https://github.com/NVIDIA/NeMo/archive/refs/heads/main.tar.gz",
    "gradio>=5.0.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

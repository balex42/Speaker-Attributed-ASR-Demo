replicaCount: 1

image:
  repository: ghcr.io/balex42/speaker-attributed-asr-demo
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application runtime options passed to app.py
app:
  # Set to true to load both baked Hugging Face models at container startup
  preloadModels: false
  # Default spoken language ISO code for nvidia/canary-1b-v2 (e.g. "de", "en", "fr", "es")
  language: "de"
  # Default ASR batch size (chunks per inference pass; 1 minimizes CPU RAM usage)
  batchSize: 1
  # Maximum ASR chunk duration in seconds before splitting at silence gaps
  maxChunkSec: 30
  # Optional explicit device override ("cuda" or "cpu"); leave empty for auto-detection
  device: ""
  # Optional Hugging Face token secret reference for higher rate limits
  hfTokenSecret:
    name: ""
    key: "HF_TOKEN"

# Persistent storage for caching additional models (/cache).
# Disabled by default since Nemotron-3-Diarization and canary-1b-v2 are baked into /app/models/huggingface.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# Optional NVIDIA GPU scheduling settings
gpu:
  enabled: false
  count: 1
  runtimeClassName: ""

service:
  type: ClusterIP
  port: 7860

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - host: asr-demo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podLabels: {}

# Matches the Wolfi nonroot user (UID 65532) in Containerfile
podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false

resources:
  requests:
    cpu: "1000m"
    memory: "4Gi"
  limits:
    cpu: "4000m"
    memory: "12Gi"

nodeSelector: {}
tolerations: []
affinity: {}

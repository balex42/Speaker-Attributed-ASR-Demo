apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "speaker-attributed-asr-demo.fullname" . }}
  labels:
    {{- include "speaker-attributed-asr-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "speaker-attributed-asr-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "speaker-attributed-asr-demo.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.gpu.enabled .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "7860"
            - "--language"
            - {{ .Values.app.language | default "de" | quote }}
            - "--batch-size"
            - {{ .Values.app.batchSize | default 1 | toString | quote }}
            - "--max-chunk-sec"
            - {{ .Values.app.maxChunkSec | default 30 | toString | quote }}
            {{- if .Values.app.preloadModels }}
            - "--preload"
            {{- end }}
            {{- if .Values.app.device }}
            - "--device"
            - {{ .Values.app.device | quote }}
            {{- end }}
          env:
            - name: GRADIO_SERVER_NAME
              value: "0.0.0.0"
            - name: GRADIO_SERVER_PORT
              value: "7860"
            - name: ASR_LANGUAGE
              value: {{ .Values.app.language | default "de" | quote }}
            - name: ASR_BATCH_SIZE
              value: {{ .Values.app.batchSize | default 1 | toString | quote }}
            - name: ASR_MAX_CHUNK_SEC
              value: {{ .Values.app.maxChunkSec | default 30 | toString | quote }}
            - name: HF_HOME
              value: {{ if .Values.persistence.enabled }}"/cache/huggingface"{{ else }}"/app/models/huggingface"{{ end }}
            - name: TORCH_HOME
              value: "/cache/torch"
            - name: NEMO_CACHE_DIR
              value: "/cache/nemo"
            {{- if .Values.app.hfTokenSecret.name }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.hfTokenSecret.name }}
                  key: {{ .Values.app.hfTokenSecret.key | default "HF_TOKEN" }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          resources:
            requests:
              {{- toYaml .Values.resources.requests | nindent 14 }}
              {{- if .Values.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.gpu.count }}
              {{- end }}
            limits:
              {{- toYaml .Values.resources.limits | nindent 14 }}
              {{- if .Values.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.gpu.count }}
              {{- end }}
      volumes:
        - name: model-cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-cache" (include "speaker-attributed-asr-demo.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
